<style>
:root{--bgi:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--card:#ffffff;--ink:#23304a;--soft:#6b7690;--line:#f0dfb8;--ok:#1fa971;--bad:#e5484d;--sel:#c8f1ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2236;--bgi:#1b2236;--card:#273050;--ink:#fff4d6;--soft:#aab4d0;--line:#3a4570;--sel:#1d5e57}}
:root[data-theme="dark"]{--bg:#1b2236;--bgi:#1b2236;--card:#273050;--ink:#fff4d6;--soft:#aab4d0;--line:#3a4570;--sel:#1d5e57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bgi);background-attachment:fixed;color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{background:linear-gradient(90deg,#ff3d81,#14b8a6,#2f80ed,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;font-size:30px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--soft);margin:0 0 16px}
.stars{text-align:center;font-size:22px;margin-bottom:12px}
.unit{display:flex;align-items:center;gap:14px;width:100%;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:14px;margin-bottom:12px;font:inherit;font-size:20px;font-weight:700;text-align:start;cursor:pointer}
.unit .e{font-size:40px;background:var(--c);border-radius:18px;width:64px;height:64px;display:grid;place-items:center;flex:none}
.unit small{display:block;font-weight:400;color:var(--soft);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 18px;background:#14b8a6;color:#fff;box-shadow:0 4px 0 #0e8f81;cursor:pointer;font-size:16px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.q{box-shadow:0 5px 0 #b8e6df;background:var(--card);border-radius:24px;padding:20px;text-align:center;font-size:24px;font-weight:700;line-height:1.7;margin-bottom:14px;border:3px solid var(--line)}
.si{display:block;width:100%;max-width:300px;margin:0 auto 10px;border-radius:20px}
.nm{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border-radius:18px;border:3px solid #ff7eb6;background:var(--card);color:var(--ink);margin-bottom:12px}
.fl{position:fixed;top:-40px;font-size:38px;animation:fl 1.6s ease-in forwards;pointer-events:none;z-index:9}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fl{display:none}}
.opt.tf{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:28px;border-radius:26px;padding:16px 8px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.opt.tfy:not(.ok):not(.bad){background:#e8fbf1;border-color:#1fa971;color:#0f7a4e}
.opt.tfn:not(.ok):not(.bad){background:#ffecec;border-color:#e5484d;color:#b42318}
.opt.ok svg circle,.opt.bad svg circle{fill:#fff}.opt.ok svg path{stroke:#1fa971}.opt.bad svg path{stroke:#e5484d}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.nav .btn{flex:1;background:#14b8a6;box-shadow:0 4px 0 #0e8f81}
.btn.sh{background:#14b8a6;box-shadow:0 4px 0 #0e8f81}

const SK='[\u064B-\u0652\u0670]*',AL='\u0621-\u064A';

function fixTTS(t){
 t=String(t);if(NAME){const sn=skn(DIC[NAME.trim()]||NAME);if(sn!==NAME)t=t.split(NAME).join(sn)}
 t=t.replace(/ﷺ/g,' صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ');
 PHR.forEach(x=>{t=t.replace(x[0],(m,p)=>p+x[1])});
 if(TAFKHEEM){t=t.replace(RA,'$1$2\u0627\u0644\u0644\u0651\u064E\u0670\u0647$3').replace(RL,'$1\u0644\u0650\u0644\u0651\u064E\u0670\u0647$2')}
 t=t.replace(/[()«»\[\]]/g,' ').replace(/(\.{2,}|…)/g,' ، ').replace(/[|]/g,' ، ');
 return t.split(/\s+/).map(w=>{if(!w||HAS.test(w))return w;const m=w.match(/^[\u0621-\u064A]+/);if(!m)return w;const L=m[0],r=w.slice(L.length);

}

 const b=e.target.closest&&e.target.closest(CLICK_SEL);
 if(!b||b.disabled||MUTED)return;
 try{const a=new Audio(CLICK_SRC);a.volume=1;a.play().catch(()=>{})}catch(err){}
},true);

/* زرار الرجوع في الموبايل */
(function(){
 const st=document.createElement('style');
 st.textContent='.xd{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}.xc{background:var(--card,#fff);color:var(--ink,#23304a);border:2px solid var(--line,#f0dfb8);border-radius:24px;padding:22px 20px 18px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.25);font-family:inherit}.xc h2{margin:0 0 6px;font-size:21px}.xc p{margin:0 0 16px;color:var(--soft,#6b7690);font-size:16px}.xr{display:flex;gap:10px}.xr .btn{flex:1}.xr .xn{background:#e5484d;box-shadow:0 4px 0 #b83539}';
 document.head.appendChild(st);
 window.exitAsk=function(yes){
  if(document.querySelector('.xd'))return;
  const d=document.createElement('div');d.className='xd';d.setAttribute('role','dialog');
  d.innerHTML='<div class="xc"><h2>هتخرج من التطبيق؟</h2><p>متأكد إنك عايز تخرج من التطبيق؟</p><div class="xr"><button class="btn xs">لا، أكمّل</button><button class="btn xn">أيوه، اخرج</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('.xs').onclick=()=>d.remove();
  d.querySelector('.xn').onclick=()=>{d.remove();yes()};
  d.onclick=e=>{if(e.target===d)d.remove()};
 };
 let SCR=null,EXITING=false;window.__exiting=function(){EXITING=true};
 const _h=home,_c=catScreen,_m=catMenu,_p=play;
 home=function(){SCR={t:'home'};return _h.apply(this,arguments)};
 catScreen=function(ci){SCR={t:'cat',ci:ci};return _c.apply(this,arguments)};
 catMenu=function(ui){SCR={t:'menu',ui:ui};return _m.apply(this,arguments)};
 play=function(ui){SCR={t:'play',ui:ui};return _p.apply(this,arguments)};
 let trap=false;
 let gdone=false;const arm=(e)=>{if(EXITING)return;const g=e&&e.isTrusted&&(e.type==='click'||e.type==='keydown'||e.type==='pointerup'||e.type==='touchend');if(g&&!gdone){gdone=true;try{history.pushState({a:1},'');trap=true}catch(x){}return}if(trap)return;try{history.pushState({a:1},'');trap=true}catch(x){}};
 arm();
 ['pointerdown','touchstart','pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,arm,true));
 window.addEventListener('popstate',()=>{
  if(EXITING)return;
  trap=false;arm();
  const xd=document.querySelector('.xd');if(xd){xd.remove();return}for(const id of ['rov','pov','pfs']){const ov=document.getElementById(id);if(ov&&ov.classList.contains('on')){ov.classList.remove('on');return}}const lb=document.querySelector('.lb');if(lb){lb.remove();return}
  if(SCR&&SCR.t==='play'){goBack(SCR.ui)}
  else if(SCR&&SCR.t==='menu'){catScreen(CI(SCR.ui))}
  else if(SCR&&SCR.t==='cat'){home()}
  else{exitAsk(()=>{window.exitFlowYes()})}
 });
})();
</script>
<style>
.pbar{display:flex;gap:12px;justify-content:center;align-items:center;margin:12px 0 4px}
.pfab{width:56px;height:56px;border-radius:50%;border:3px solid #fff;color:#fff;font:900 22px Cairo,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;padding:0;overflow:hidden}
.pfab.m{background:none;border:0;box-shadow:none;padding:0}.pfab.m img{width:100%;height:100%;object-fit:contain;display:block}
.pfab.f{background:#1877f2}.pfab.l{background:#16a34a}
.pmath{font:900 22px Cairo,sans-serif;margin:10px 0;text-align:center}
.pmopt{display:inline-block;margin:6px;padding:12px 22px;border-radius:14px;border:2px solid #7c3aed;background:#fff;font:900 20px Cairo,sans-serif;cursor:pointer;color:#1f2937}
.pov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
.pov.on{display:flex}
.pbox{background:#fff;color:#1f2937;border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px;direction:rtl;font-family:Cairo,sans-serif;box-sizing:border-box}
.pbox h2{margin:0 0 8px;font-size:20px}
.pst{display:flex;gap:10px;margin:10px 0}
.pst div{flex:1;border-radius:14px;padding:10px;text-align:center;font-weight:900;font-size:17px}
.pst .ok{background:#dcfce7;color:#166534}.pst .no{background:#fee2e2;color:#991b1b}
.pwr{display:block;width:100%;text-align:right;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;margin:6px 0;font:700 15px Cairo,sans-serif;color:#1f2937;cursor:pointer}
.pbtn{background:#7c3aed;color:#fff;border:0;border-radius:12px;padding:10px 16px;font:900 16px Cairo,sans-serif;cursor:pointer;margin:8px 4px 0 0}
.pbtn.g{background:#e5e7eb;color:#111827}
.prs{font-size:34px;letter-spacing:6px;cursor:pointer;color:#d1d5db;user-select:none}.prs.on{color:#f59e0b}
.ptx{width:100%;min-height:70px;border:1px solid #d1d5db;border-radius:12px;padding:8px;font:16px Cairo,sans-serif;margin-top:8px;box-sizing:border-box}
.psec{margin-top:14px;border-top:1px solid #e5e7eb;padding-top:10px}
</style>
<style>
.pfs{position:fixed;inset:0;background:#fff;z-index:85;overflow:auto;display:none;direction:rtl;font-family:Cairo,sans-serif;padding:16px 16px 40px;box-sizing:border-box}
.pfs.on{display:block}
.pback{background:#4db6a0;color:#fff;border:0;border-radius:18px;padding:12px 26px;font:900 18px Cairo,sans-serif;box-shadow:0 4px 0 #2e8f7a;cursor:pointer;float:left}
.pfs h1{text-align:center;font:900 30px Cairo,sans-serif;margin:64px 0 4px;background:linear-gradient(90deg,#14b8a6,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.psub{text-align:center;color:#6b7280;font-size:18px;margin:0 0 16px}
.pcards{display:flex;gap:10px}
.pc{flex:1;border:3px solid;border-radius:20px;padding:12px 6px;text-align:center;background:#fff;box-sizing:border-box}
.pc b{display:block;font-size:34px;font-weight:900;line-height:1.2}
.pc span{font-size:16px;color:#374151}
.pc i{display:block;font-style:normal;font-size:20px;margin-top:6px}
.pwl{margin:24px 0 8px;font:900 20px Cairo,sans-serif;text-align:right}
.pempty{text-align:center;color:#6b7280;font-size:18px;padding:18px 0}
.pbig{display:block;width:100%;border:0;border-radius:18px;padding:16px;font:900 20px Cairo,sans-serif;color:#fff;margin-top:12px;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.pbig.t{background:#4db6a0}.pbig.b{background:#1877f2}
.mcard{background:#fff;border-radius:24px;max-width:460px;width:100%;padding:22px;direction:rtl;font-family:Cairo,sans-serif;box-sizing:border-box;text-align:center;border:3px solid #f3e3b5}
.mcard h2{font:900 26px Cairo,sans-serif;margin:4px 0 6px;color:#1f2937}
.mcard p{color:#6b7280;font-size:18px;margin:0 0 14px}
.meq{font:900 42px Cairo,sans-serif;margin:14px 0 18px;color:#1f2937;direction:ltr}
.minp{width:100%;border:3px solid #111827;border-radius:18px;padding:14px;font:900 24px Cairo,sans-serif;text-align:center;box-sizing:border-box}
.mbtns{display:flex;gap:12px;margin-top:16px}
.mbtns button{flex:1;border:0;border-radius:18px;padding:14px;font:900 20px Cairo,sans-serif;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mbtns .c{background:#9ca3af}.mbtns .d{background:#14b8a6}
#rov,#pov{z-index:90}
/* ولي الأمر + فيسبوك في صف الأيقونات اللي تحت */
.icr{flex-wrap:wrap;gap:10px}
.icr .pfab{width:58px;height:58px;flex:none;margin-bottom:8px;font-size:28px}
.icr .pfab.f{border:3px solid #0b4fb3;background:linear-gradient(180deg,#8ec0ff,#1877f2 50%,#0f5fd1);box-shadow:inset 0 5px 7px rgba(255,255,255,.5),0 5px 0 #0b4fb3,0 9px 12px rgba(11,79,179,.3)}
.icr .pfab.l{border:3px solid #166534;background:linear-gradient(180deg,#86efac,#22c55e 50%,#16a34a);box-shadow:inset 0 5px 7px rgba(255,255,255,.5),0 5px 0 #166534,0 9px 12px rgba(22,101,52,.3)}
.icr .pfab.m{border:0;background:none;box-shadow:none;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.28))}
.icr .pfab.m img{transform:scale(1.3)}
.icr .pfab:active{transform:translateY(4px)}
@media (max-width:370px){.icr{gap:6px}.icr .ic,.icr .pfab{width:50px;height:50px}}
/* صفحة ولي الأمر والنوافذ المنبثقة = نفس ثيم التطبيق (نهاري/ليلي) */
.pfs{background:var(--bgi);color:var(--ink)}
.psub,.pempty,.mcard p,.pbox p{color:var(--soft)}
.pc{background:var(--card);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 10%,transparent)}
.pc span{color:var(--ink)}
.pwl{color:var(--ink)}
.pwr{background:color-mix(in srgb,#f59e0b 14%,var(--card));border:2px solid color-mix(in srgb,#f59e0b 45%,var(--card));color:var(--ink);border-radius:16px;box-shadow:0 3px 0 color-mix(in srgb,#f59e0b 30%,transparent)}
.pbox,.mcard{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 10%,transparent)}
.mcard h2,.meq,.pbox h2{color:var(--ink)}
.minp,.ptx{background:var(--bg);color:var(--ink);border:3px solid var(--line);outline:0}
.minp:focus,.ptx:focus{border-color:#14b8a6}
.psec{border-top-color:var(--line)}
.pst .ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.pst .no{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.pbtn.g{background:var(--line);color:var(--ink)}
.mbtns .c{background:var(--soft)}
.prs{color:color-mix(in srgb,var(--soft) 40%,var(--card))}.prs.on{color:#f59e0b}
.xd{background:color-mix(in srgb,var(--bgi) 70%,transparent)}
.rowsb{display:block;width:88%;max-width:440px;margin:40px auto 26px;border:0;border-radius:24px;padding:16px;font:900 24px Cairo,'Segoe UI',Tahoma,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(180deg,#a78bfa,#7c3aed);box-shadow:inset 0 4px 6px rgba(255,255,255,.35),0 6px 0 #5b21b6,0 10px 14px rgba(91,33,182,.25)}
.pc.g,.pc.r,.pc.y{border:0;padding:14px 6px 12px;border-radius:22px}
.pc.g{background:linear-gradient(180deg,#5eead4 -40%,#34c98a,#22a06b);box-shadow:0 5px 0 #15803d}
.pc.r{background:linear-gradient(180deg,#fda4af,#fb7185 45%,#ef4b5f);box-shadow:0 5px 0 #be2c3f}
.pc.y{background:linear-gradient(180deg,#fde68a,#fbbf24 45%,#f59e0b);box-shadow:0 5px 0 #b97809}
.pc.g b,.pc.r b,.pc.y b{color:#fff;font-size:38px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pc.g span,.pc.r span,.pc.y span{color:#fff;font-weight:900;font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.pwr{background:var(--card);border:3px solid #fbcfe8;border-radius:22px;padding:10px 14px 11px;margin:10px 0;box-shadow:0 4px 0 #fbcfe8;text-align:right;color:var(--ink)}
.pwr small{display:block;color:var(--soft);font:700 14px Cairo,sans-serif}
.pwr b{display:block;margin:2px 0 4px;font:900 17px/1.6 Cairo,sans-serif;color:var(--ink)}
.pwr em{display:block;font:800 14px Cairo,sans-serif;font-style:normal;color:#e5484d}
.prow{display:flex;gap:10px;margin-top:16px}
.prow .pbig{margin-top:0;flex:1;padding:14px 8px;font-size:19px;color:#fff}
.pbig.t2{background:linear-gradient(180deg,#b79cfb,#8b5cf6 55%,#7c3aed);box-shadow:0 5px 0 #5b21b6}
.pbig.b2{background:linear-gradient(180deg,#93c5fd,#3b82f6 55%,#2563eb);box-shadow:0 5px 0 #1d4ed8}
.pbig:active{transform:translateY(3px)}
.gtop{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 0;direction:rtl}
.gic{width:44px;height:44px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.gpill{position:relative;display:inline-block;white-space:nowrap;padding:6px 24px 7px;border-radius:99px;font:900 15px Cairo,'Segoe UI',Tahoma,sans-serif;color:#fff;background:linear-gradient(180deg,#ff9cc4,#f5669f);box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 4px 0 #d83f7e,0 6px 10px rgba(216,63,126,.25)}

.rowsb:active{transform:translateY(4px);box-shadow:inset 0 4px 6px rgba(255,255,255,.35),0 2px 0 #5b21b6}
.pmopt{background:var(--bg);color:var(--ink);border:3px solid var(--line)}
</style>

<script>
var FB_URL='https://www.facebook.com/learnourreligin';            // رابط صفحة فيسبوك (هيتحط هنا)
var LINK2_URL='';         // رابط تاني (هيتحط هنا)
var LINK2_ICON='🔗';
var LQ=null;
function qst(){try{if(window._QN!==NAME||!window._Q){window._QN=NAME;window._Q={ok:JSON.parse(localStorage.getItem('ok_'+NAME)||'{}'),wr:JSON.parse(localStorage.getItem('wr_'+NAME)||'{}'),rt:localStorage.getItem('rt_'+NAME)||''}}}catch(e){window._Q={ok:{},wr:{},rt:''}}return window._Q}
function qsave(){try{const q=qst();localStorage.setItem('ok_'+NAME,JSON.stringify(q.ok));localStorage.setItem('wr_'+NAME,JSON.stringify(q.wr))}catch(e){}}
function postForm(d,u){try{let fr=document.getElementById('rfr');if(!fr){fr=document.createElement('iframe');fr.id='rfr';fr.name='rfr';fr.style.display='none';document.body.appendChild(fr)}const fm=document.createElement('form');fm.method='POST';fm.action=u||FORM.url;fm.target='rfr';fm.style.display='none';Object.keys(d).forEach(k=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=d[k];fm.appendChild(i)});document.body.appendChild(fm);fm.submit();setTimeout(()=>fm.remove(),3000)}catch(e){}}
function pq(){try{return JSON.parse(localStorage.getItem('pq_forms')||'[]')}catch(e){return[]}}
function pqs(l){try{localStorage.setItem('pq_forms',JSON.stringify(l))}catch(e){}}
var INF={},MQ=[];
function sendRaw(d,u){return new Promise(function(res){
  if(navigator.onLine===false){res(false);return}
  var body=new URLSearchParams(d);
  var viaForm=function(){postForm(d,u);res(true)};
  var viaBeacon=function(){var ok=false;try{ok=navigator.sendBeacon&&navigator.sendBeacon(u||FORM.url,body)}catch(e){}if(ok)res(true);else viaForm()};
  try{
    if(window.fetch){fetch(u||FORM.url,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(){res(true)}).catch(viaBeacon)}
    else viaBeacon()
  }catch(e){viaBeacon()}
})}
function dropQ(id){pqs(pq().filter(function(x){return x.id!==id}));MQ=MQ.filter(function(x){return x.id!==id})}
function sendItem(it){if(INF[it.id])return;INF[it.id]=1;sendRaw(it.d,it.u).then(function(ok){delete INF[it.id];if(ok)dropQ(it.id);else if(!MQ.some(function(x){return x.id===it.id}))MQ.push(it)})}
function flushQ(){var seen={};pq().concat(MQ).forEach(function(it){if(!seen[it.id]){seen[it.id]=1;sendItem(it)}})}
function sendRate(n,txt){const q=qst();q.rt=new Date().toDateString();try{localStorage.setItem('rt_'+NAME,q.rt)}catch(e){}const d={};d[RATE.n]=NAME;d[RATE.f]=(n?'تقييم '+n+'/5 ⭐':'رسالة من ولي الأمر')+' | رأي: '+(txt||'بدون تعليق')+' | '+stat();const it={id:Date.now()+'_'+Math.random().toString(36).slice(2),d:d,u:RATE.url};const l=pq();l.push(it);pqs(l);sendItem(it)}
window.addEventListener('online',flushQ);setTimeout(flushQ,3000);
function ratingHTML(){let s='';return `<div class="psec"><h2>رأيكم يهمنا ⭐</h2><p>مدى رضاكم عن التطبيق؟</p><div id="rst">${[1,2,3,4,5].map(i=>`<span class="prs" data-n="${i}">★</span>`).join('')}</div><textarea class="ptx" id="rtx" placeholder="اكتب رأيك هنا"></textarea><button class="pbtn" id="rsend">إرسال الرأي</button></div>`}
function bindRating(root,after){let n=0;root.querySelectorAll('.prs').forEach(sp=>sp.onclick=()=>{n=+sp.dataset.n;root.querySelectorAll('.prs').forEach(x=>x.classList.toggle('on',+x.dataset.n<=n))});root.querySelector('#rsend').onclick=()=>{const t=root.querySelector('#rtx').value.trim();if(!n&&!t){alert('اختر عدد النجوم أو اكتب رسالتك');return}sendRate(n,t);alert('شكرًا لرأيكم 🌟 وصلت رسالتكم');after&&after()}}
function openRate(){const b=document.getElementById('rbx');b.innerHTML=`<h2>قبل ما تخرج</h2><p>إيه رأيكم في التطبيق؟</p>`+ratingHTML()+`<button class="pbtn g" id="rcl">إغلاق</button>`;document.getElementById('rov').classList.add('on');bindRating(b,()=>document.getElementById('rov').classList.remove('on'));b.querySelector('#rcl').onclick=()=>document.getElementById('rov').classList.remove('on')}
function openParent(){const q=qst();const ks=Object.keys(q.ok),kw=Object.keys(q.wr);const b=document.getElementById('pbx');
b.innerHTML=`<h2>ولي الأمر · ${esc(NAME)}</h2><div class="pst"><div class="ok">✔ صح: ${ks.length}</div><div class="no">✘ غلط: ${kw.length}</div></div>`+
(kw.length?`<p>الأسئلة اللي غلط فيها (اضغط للذهاب للسؤال):</p>`+kw.map(k=>`<button class="pwr" data-k="${encodeURIComponent(k)}">${esc((q.wr[k].t||'سؤال').slice(0,120))}</button>`).join(''):`<p>مفيش أسئلة غلط حاليًا 👏</p>`)+
ratingHTML()+`<button class="pbtn g" id="pcl">إغلاق</button>`;
document.getElementById('pov').classList.add('on');
b.querySelectorAll('.pwr').forEach(x=>x.onclick=()=>{const e=q.wr[decodeURIComponent(x.dataset.k)];document.getElementById('pov').classList.remove('on');if(e){GR=e.gr;play(e.ui,e.k)}});
bindRating(b);b.querySelector('#pcl').onclick=()=>document.getElementById('pov').classList.remove('on')}
function mathGate(cb){const a=1+Math.floor(Math.random()*9),c=1+Math.floor(Math.random()*9),s=a+c;const o=[s,s+1,s-1,s+2].filter(x=>x>0);const opts=[...new Set(o)].slice(0,3);if(!opts.includes(s))opts[0]=s;opts.sort(()=>Math.random()-.5);const b=document.getElementById('pbx');b.innerHTML=`<h2>للكبار فقط 🔒</h2><p class="pmath">كم يساوي ${a} + ${c} ؟</p><div style="text-align:center">${opts.map(x=>`<button class="pmopt" data-v="${x}">${x}</button>`).join('')}</div><button class="pbtn g" id="mcl">إلغاء</button>`;document.getElementById('pov').classList.add('on');b.querySelectorAll('.pmopt').forEach(x=>x.onclick=()=>{if(+x.dataset.v===s)cb();else{x.style.background='#fee2e2';x.style.borderColor='#dc2626'}});b.querySelector('#mcl').onclick=()=>document.getElementById('pov').classList.remove('on')}
document.getElementById('pmom').onclick=()=>mathGate(openParent);
const PBAR=document.getElementById('pbar');
const PBTN=['pmom','pfb','plk'].map(function(id){return document.getElementById(id)}).filter(Boolean);
function placeBar(){const bar=PBAR;if(bar)bar.style.display='none';const row=document.querySelector('#app .icr');if(!row)return;const rs=row.querySelector('#rs');PBTN.forEach(function(b){if(b.parentNode!==row){if(rs)row.insertBefore(b,rs);else row.appendChild(b)}})}
new MutationObserver(placeBar).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});placeBar();
document.getElementById('pfb').onclick=()=>{if(FB_URL)window.open(FB_URL,'_blank');else alert('رابط الصفحة غير متاح')};
function showLink2(){const b=document.getElementById('plk');if(LINK2_URL){b.style.display='flex';b.textContent=LINK2_ICON;b.onclick=()=>window.open(LINK2_URL,'_blank')}}
showLink2();
(function(){const _play=play;play=function(ui,k){LQ={ui:ui,k:k,gr:GR};return _play(ui,k)};
const _good=good;good=function(next,m){if(CURQ){const q=qst();q.ok[CURQ]=1;delete q.wr[CURQ];qsave()}return _good(next,m)};
const _bad=bad;bad=function(){if(CURQ&&LQ){const q=qst();if(!q.ok[CURQ]){let t='';try{const g0=GR;GR=LQ.gr;const r=UN(LQ.ui).r[LQ.k];GR=g0;t=r.q||''}catch(e){}const pv=q.wr[CURQ];q.wr[CURQ]={ui:LQ.ui,gr:LQ.gr,k:LQ.k,t:t,n:(pv&&pv.n||0)+1};qsave()}}return _bad()};
const _home=home;home=function(){_home();const q=qst();if(LASTOPEN&&q.rt!==new Date().toDateString()&&!window._rs){window._rs=1;setTimeout(openRate,400)}}})();
